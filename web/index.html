<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loot Survivor agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap" rel="stylesheet">
<style>
:root {
  --void: #030402; --raise: #171d13; --edge: #2c3725; --bone: #e8dcc4; --dim: #a39a82;
  --gold: #ffe97f; --lime: #80ff00; --blood: #ff5a47;
  --num: "Jersey 20", system-ui, sans-serif;
  --bevel: inset 0 2px 0 rgb(255 255 255 / 0.07), inset 0 -3px 0 rgb(0 0 0 / 0.5);
  --drop: 0 4px 0 rgb(0 0 0 / 0.7), 0 10px 22px rgb(0 0 0 / 0.55);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: clamp(14px, min(0.84vw, 1.5vh), 20px); height: 100%; }
body { height: 100%; background: var(--void); color: var(--bone); font: 400 1.3rem/1.1 var(--num); padding: 0.8rem; overflow: hidden; }
img { image-rendering: pixelated; display: block; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
ol { list-style: none; }
h2 { font: 400 1.9rem/1 var(--num); color: var(--gold); letter-spacing: 0.04em; }
.good { color: var(--lime); } .bad { color: var(--blood); } .gold { color: var(--gold); } .dim { color: var(--dim); }
.n { font-family: var(--num); font-size: 1.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.ic { display: inline-block; width: 1.6rem; height: 1.6rem; flex: none; background: currentColor; -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }
.pic { width: 1.6rem; height: 1.6rem; flex: none; object-fit: contain; }

.win { height: 100%; display: grid; grid-template-columns: 21rem minmax(0, 1fr) 21rem; gap: 0.8rem; }
.panel { background: linear-gradient(#11160e, #0a0d08); border: 2px solid var(--edge); border-radius: 6px; box-shadow: var(--bevel), var(--drop); padding: 1rem; display: flex; flex-direction: column; gap: 1rem; min-height: 0; }
section { display: flex; flex-direction: column; gap: 0.5rem; min-height: 0; }
section[hidden] { display: none; }
.fit { flex: 1; min-height: 0; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; overflow: hidden; gap: 0.3rem; }
.fit > li { width: 100%; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
.card { background: var(--raise); border: 2px solid var(--edge); border-radius: 4px; box-shadow: var(--bevel), 0 3px 0 rgb(0 0 0 / 0.6); }
.scroll { overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--edge) transparent; padding: 0 0.2rem 0.3rem 0; }
.rows { display: flex; flex-direction: column; gap: 0.4rem; }
.rows li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.6rem; padding: 0.25rem 0.7rem 0.25rem 0.4rem; }
.rows b { font: 400 2rem/1 var(--num); color: var(--gold); }
.rows img { width: 2.4rem; height: 2.4rem; object-fit: contain; }
.tag { padding: 0 0.35rem; border-radius: 3px; background: var(--lime); color: #000; margin-left: 0.4rem; }

#logo { width: 11rem; image-rendering: auto; mix-blend-mode: lighten; margin: -0.2rem auto 0; }
#games { flex: 1; }
.rows li.more { display: block; padding: 0; }
.more button { width: 100%; padding: 0.3rem; color: var(--dim); border: 2px solid var(--edge); border-radius: 4px; }
.more button:hover { color: var(--gold); border-color: var(--gold); }
.rows li.none { display: block; text-align: center; padding: 2rem 0; color: var(--dim); font-size: 1.6rem; }
#podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; align-items: end; }
#podium li { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; padding: 0.5rem 0.2rem 0.6rem; }
#podium li:nth-child(1) { order: 2; padding-top: 0.9rem; padding-bottom: 1.5rem; border-color: #6d6335; }
#podium li:nth-child(2) { order: 1; } #podium li:nth-child(3) { order: 3; }
#podium img { width: 3.6rem; height: 3.6rem; object-fit: contain; filter: drop-shadow(0 3px 0 rgb(0 0 0 / 0.7)); }
#podium b { font: 400 2.6rem/0.9 var(--num); color: var(--gold); }
#games li[tabindex] { cursor: pointer; }
#board li { grid-template-columns: auto 1fr 3rem 2.6rem; }
#board b { text-align: right; }
.slain { display: flex; align-items: center; gap: 0.2rem; font-size: 1.4rem; line-height: 1; }
#games .slain img { width: 1.2rem; height: 1.2rem; filter: none; }
#games .slain.won { color: var(--gold); }
#games .slain.won img { filter: hue-rotate(-65deg) brightness(1.2); }
#games li[tabindex]:hover { background: #1e2619; }
#games li.on { border-color: var(--gold); box-shadow: var(--bevel), 0 0 0 2px var(--gold), 0 3px 0 rgb(0 0 0 / 0.6); }
#reach { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
#reach div { text-align: center; padding: 0.4rem 0 0.5rem; }
#reach b { display: block; font: 400 2rem/1 var(--num); color: var(--gold); }
#reach b.good { color: var(--lime); } #reach b.bad { color: var(--blood); }

#warn { font-size: 1.5rem; }
#mid { display: flex; flex-direction: column; gap: 0.8rem; min-width: 0; min-height: 0; }
#stage { position: relative; flex: 1; min-height: 0; border: 2px solid var(--edge); border-radius: 6px; box-shadow: var(--drop); background: #000; overflow: hidden; display: grid; place-content: center; text-align: center; }
#stage.view { place-content: stretch; }
#stage iframe { width: 100%; height: 100%; border: 0; }
#stage b.wait { font: 400 4rem/1 var(--num); color: var(--gold); align-self: center; }
#stage.seats { border: 0; box-shadow: none; background: none; text-align: left; overflow-y: auto; place-content: stretch; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-auto-rows: minmax(min-content, 1fr); gap: 0.6rem; }
#stage.seats.many { font-size: 0.9em; }
@media (min-height: 950px) { #stage.seats.few, #stage.seats.one { font-size: 1.15em; } }
#stage.seats.one { place-content: center; grid-template-columns: minmax(0, 30rem); grid-auto-rows: auto; }
.seat { display: flex; flex-direction: column; justify-content: space-between; gap: 0.4em; padding: 0.5em 0.7em 0.6em; min-width: 0; }
.seat header, .seat .lvl, .seat .had { display: flex; align-items: center; gap: 0.5em; }
.seat header { justify-content: space-between; color: var(--dim); }
.seat button { padding: 0 0.5em; border: 2px solid var(--edge); border-radius: 3px; color: var(--bone); }
.seat button:hover { color: var(--gold); border-color: var(--gold); }
.seat .lvl b { font: 400 2.6em/0.8 var(--num); color: var(--gold); }
.seat .lvl span { color: var(--dim); line-height: 1; }
.hp { position: relative; height: 1.3em; background: #000; border: 2px solid var(--edge); border-radius: 3px; overflow: hidden; }
.hp i { position: absolute; inset: 0 auto 0 0; background: #3f7d00; }
.hp.low i { background: #a3261a; }
.hp span { position: absolute; inset: 0; display: grid; place-content: center; line-height: 1; text-shadow: 0 2px 0 #000; }
.seat .had { justify-content: space-between; }
.seat .had span { display: inline-flex; align-items: center; gap: 0.25em; }
.seat .had img { width: 1.2em; height: 1.2em; }
.seat .now { display: flex; align-items: center; gap: 0.5em; min-height: 3em; line-height: 1; }
.seat .now > img { width: 3em; height: 3em; flex: none; object-fit: contain; }
.seat .now > span { flex: 1; min-width: 0; }
.seat .now b { font: 400 2em/0.8 var(--num); color: var(--blood); text-align: right; }
.seat .now small { display: block; font-size: 1em; color: var(--dim); white-space: nowrap; }
.gear { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0.3em; max-width: 24em; }
#stage.seats.many .gear { grid-template-columns: repeat(4, 1fr); max-width: 11em; }
.gear div { display: flex; flex-direction: column; align-items: center; padding: 0.1em 0.1em 0.15em; min-width: 0; }
.gear .none { border-style: dashed; background: none; box-shadow: none; }
.gear div::before { content: ""; display: block; width: 100%; aspect-ratio: 1; }
.gear div:has(img)::before { display: none; }
.gear img { width: 100%; height: auto; aspect-ratio: 1; }
.gear b { font: 400 1em/1 var(--num); min-height: 1em; }
.seat .did { display: flex; gap: 0.4em; min-height: 2.2em; }
.seat .chip { height: 2.2em; padding: 0 0.2em; font-size: 1em; flex: 1 1 0; min-width: 0; justify-content: center; }
#dock { flex: none; flex-direction: row; align-items: center; gap: 0.7rem; padding: 0.6rem 0.8rem; min-height: 4.6rem; }
#mode { font: 400 1.7rem/1 var(--num); letter-spacing: 0.06em; white-space: nowrap; }
#mode::before { content: ""; display: inline-block; width: 0.6rem; height: 0.6rem; margin-right: 0.4rem; background: currentColor; vertical-align: 0.12em; }
#mode.live::before { animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.15; } }
#which { white-space: nowrap; }
#plan { flex: 1; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.5rem; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 0.4rem; height: 3rem; padding: 0 0.8rem; font: 400 1.6rem/1 var(--num); background: var(--raise); border: 2px solid var(--edge); border-radius: 4px; box-shadow: var(--bevel), 0 3px 0 rgb(0 0 0 / 0.6); white-space: nowrap; }
.chip .pic { width: 2.2rem; height: 2.2rem; }
.chip small { font-size: 1.25rem; color: var(--dim); }
.chip.on { color: var(--gold); border-color: var(--gold); }
.chip.off { color: var(--dim); opacity: 0.7; }
.chip.out img { filter: grayscale(1) brightness(0.6); }
#again { padding: 0 0.5rem; border: 2px solid var(--edge); border-radius: 3px; color: var(--dim); white-space: nowrap; }
#again:hover { color: var(--gold); border-color: var(--gold); }
#golive { color: #000; background: var(--lime); border-radius: 3px; padding: 0.2rem 0.6rem; white-space: nowrap; }

.big { font: 400 3.2rem/0.9 var(--num); }
.big small { font-size: 1.3rem; color: var(--dim); }
.row { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; align-items: center; }
.row > span { display: inline-flex; align-items: center; gap: 0.35rem; }
#zoo { display: flex; flex-direction: column; gap: 0.4rem; }
#zoo .head span { display: inline-flex; gap: 0.6rem; align-items: baseline; }
.tally { gap: 0.2rem 0.7rem; }
.cells { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem; }
.cells div { position: relative; aspect-ratio: 1; padding: 0.15rem; }
.cells img { width: 100%; height: 100%; object-fit: contain; }
.cells b { position: absolute; right: 0.2rem; bottom: 0; font: 400 1.2rem/1 var(--num); text-shadow: 0 2px 0 #000, 2px 0 0 #000, -2px 0 0 #000; }
.cells i { position: absolute; left: 0.2rem; top: 0.1rem; font-style: normal; line-height: 1; color: var(--gold); text-shadow: 0 2px 0 #000, 2px 0 0 #000, -2px 0 0 #000; }
.cells .claim { border-style: dashed; border-color: var(--dim); background: none; box-shadow: none; }
.cells .claim img { opacity: 0.35; filter: grayscale(1); }
.cells .mega { border-color: var(--gold); }
#bags, #run { flex: 1; }
#sacks .arts { display: flex; gap: 0.15rem; }
#sacks img { width: 2rem; height: 2rem; }
#sacks li { padding-left: 0.7rem; grid-template-columns: auto 1fr auto 3.4rem; }
#sacks b { text-align: right; }
.seg { display: flex; gap: 0.3rem; }
.seg button { padding: 0 0.5rem; border: 2px solid var(--edge); border-radius: 3px; color: var(--dim); }
.seg button[aria-pressed="true"] { color: #000; background: var(--gold); border-color: var(--gold); }
.seg button:disabled { opacity: 0.4; cursor: default; }
#run[hidden] { display: none; }
#run { gap: 0.6rem; }
#run label { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
#run input { font: inherit; color: var(--bone); background: #000; border: 2px solid var(--edge); border-radius: 3px; padding: 0.1rem 0.4rem; width: 5rem; text-align: right; }
#run input:focus { border-color: var(--gold); outline: none; }
#run input:disabled { opacity: 0.4; }
#run input[type="password"] { flex: 1; width: auto; min-width: 0; text-align: left; }
#run form { display: flex; gap: 0.5rem; align-items: center; }
#run form label { flex: 1; }
#run .over .cap { color: var(--blood); border-color: var(--blood); }
#picks li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.5rem; padding: 0.1rem 0.4rem; }
#picks li.on { border-color: var(--gold); }
#picks input[type="checkbox"] { width: 1.2rem; height: 1.2rem; accent-color: var(--gold); }
.acts { display: flex; gap: 0.4rem; }
.acts button { flex: 1; padding: 0.3rem; border: 2px solid var(--edge); border-radius: 4px; color: var(--bone); }
.acts button:hover:not(:disabled) { border-color: var(--gold); }
.acts .go { color: #000; background: var(--gold); border-color: var(--gold); }
.acts .stop { color: var(--blood); border-color: var(--blood); }
.acts button:disabled { opacity: 0.4; cursor: default; }
.link { color: var(--dim); text-decoration: underline; }


@media (max-width: 900px) {
  body { height: auto; overflow: auto; padding: 0.5rem; }
  .win { display: flex; flex-direction: column; height: auto; }
  #mid { order: -1; }
  #stage { flex: none; height: 78svh; }
  #stage.seats, #stage.seats.one { height: auto; overflow: visible; grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto; }
  #stage.seats.many .gear { grid-template-columns: repeat(8, 1fr); max-width: 24em; }
  #dock { flex-wrap: wrap; }
  #board { max-height: 22rem; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="win">
  <aside class="panel">
    <img id="logo" alt="Loot Survivor">
    <section id="games"><div class="head" id="modes"></div><div id="sum"></div><ol id="podium"></ol><ol id="board" class="rows scroll"></ol></section>
  </aside>
  <main id="mid">
    <p id="warn" class="bad" hidden></p>
    <div id="stage"></div>
    <div class="panel" id="dock"><span id="mode"></span><span id="which"></span><button type="button" id="again" title="Load the spectator again" hidden>Reload</button><div id="plan"></div><button type="button" id="golive" hidden>Back to live</button></div>
  </main>
  <aside class="panel">
    <section id="wallet"></section>
    <section id="run" hidden></section>
    <section id="beasts"></section>
    <section id="bags"></section>
  </aside>
</div>
<script type="module">
import { beastArt, icon, lootArt, statArt } from "/art.js";

const $ = (id) => document.getElementById(id);
document.head.append(Object.assign(document.createElement("link"), { rel: "icon", href: icon.favicon }));
$("logo").src = icon.logo;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const get = (url) => fetch(url).then((r) => (r.ok ? r.json() : null)).catch(() => null);
const round = (n, digits = 0) => Number(n).toLocaleString("en", { maximumFractionDigits: digits });
const put = (el, html) => { if (el.html !== html) el.innerHTML = el.html = html; };
const title = (word) => word[0].toUpperCase() + word.slice(1);
const stat = (name) => `<i class="ic" style="--i:url(${statArt(name)})" title="${title(name)}"></i>`;
const pic = (name, label) => `<img class="pic" src="${icon[name]}" alt="${label}" title="${label}">`;
const art = (name) => `<img class="pic" src="${lootArt(name)}" alt="${esc(name)}" title="${esc(name)}">`;
const won = (g) => g.claimed ?? g.claimable;
const slain = (g) => (g.beasts == null ? `<span></span>` : `<span class="slain${won(g) ? " won" : ""}" title="Named beasts slain${won(g) ? `, ${won(g)} ${g.claimed == null ? "to claim" : "claimed"}` : ""}"><img src="${icon.skull}" alt="Named beasts slain">${g.beasts}</span>`);
const MARK = { lootBag: icon.bag };
const face = (name, collection) => (/^[A-Za-z]+$/.test(name ?? "") ? beastArt(name, collection) : icon.skull);
const mark = (games) => MARK[games.map((g) => g.mode).find((m) => MARK[m])] ?? icon.skull;
const portrait = (g) => (killer(g) ? face(killer(g)[1]) : mark([g]));
const killer = (g) => (g.ending ?? "").match(/against (?:".*" )?(\w+) level (\d+)$/);

const WATCH = "https://www.lootsurvivor.io/watch?id=";
const MOVES = { attack: "Fight", flee: "Flee", explore: "Explore" };
const SLOW_MS = 60_000;
const RANKING_MS = 3_000;
const INDEXED_MS = 10_000;
const ROUND_MS = 300;
const CHECK_STALE_MS = 2 * 86_400_000;
const BAGS = 25;
const LATEST = 20;
const STRIP = 5;
let every = false;
const SORTS = { mean: "Level", kills: "Beasts" };
const keep = (key, value) => { try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch { return null; } };
let bagSort = keep("bagSort") in SORTS ? keep("bagSort") : "mean";

const items = {};
const byName = {};
const data = { games: [], wallet: null, beasts: null, summary: null, bags: null, check: null, cycle: null };
const seen = new Map();
let slots = [];

const lives = () => data.games.filter((g) => g.live);
const picked = () => Number(new URLSearchParams(location.search).get("game")) || null;
const target = () => data.games.find((g) => g.id === picked()) ?? (lives().length ? null : (data.games[0] ?? null));
const plain = (text) => text.replace(/\bT(\d)/g, "tier $1");

function moveHtml(e) {
  const last = e.actions.at(-1)?.type;
  if (e.phase !== "battle") return MOVES[last] ? `<span class="chip on">${MOVES[last]}</span>` : "";
  const odds = e.thought.match(/(\d+)% to win the fight, (\d+)% to escape/);
  return ["attack", "flee"].map((m, i) => `<span class="chip ${m === last ? "on" : "off"}">${MOVES[m]}${odds ? ` ${odds[i + 1]}%` : ""}</span>`).join("");
}

function planHtml(e, market) {
  if (e.phase === "battle") return moveHtml(e);
  const why = (name) => plain(e.thought.match(new RegExp(`${name} \\(([^)]*)\\)`))?.[1] ?? "");
  return e.actions.map((a) => {
    const g = items[a.item];
    const price = market.find((m) => m.id === a.item)?.price;
    if (a.type === "upgrade") return `<span class="chip">${stat(a.stat)}+${a.amount}</span>`;
    if (a.type === "potions") return `<span class="chip">${pic("potion", "Potions")}x${a.qty}</span>`;
    if (a.type === "buy" && g) return `<span class="chip">${art(g.name)}${price ? `${pic("gold", "Gold")}${price}` : ""}<small>${esc(why(g.name))}</small></span>`;
    if (a.type === "equip" && g) return `<span class="chip">${art(g.name)}<small>${esc(why(g.name))}</small></span>`;
    if (a.type === "drop" && g) return `<span class="chip out">${art(g.name)}<small>Dropped</small></span>`;
    return "";
  }).join("") + moveHtml(e);
}

function endHtml(g) {
  const k = killer(g);
  return `${g.level === null ? "" : `<span class="chip">Level ${g.level}</span>`}${k ? `<span class="chip"><img class="pic" src="${face(k[1])}" alt="">${k[1]} ${k[2]}</span>` : ""}${g.beasts == null ? "" : `<span class="chip" title="Named beasts slain"><img class="pic" src="${icon.skull}" alt="Named beasts slain">${g.beasts}</span>`}${toClaim(g)}${g.claimed == null ? "" : `<span class="chip gold" title="Beasts the settlement claimed for the wallet">${g.claimed} claimed</span>`}${g.gas_strk === null ? "" : `<span class="chip">${round(g.gas_strk, 1)}<small>STRK</small></span>`}`;
}

const CLAIM_TITLE = "Of those, beasts nobody minted yet or that can be taken from a stake: the ones the settlement will claim";
const toClaim = (g) => (g.claimed != null || g.claimable == null ? "" : `<span class="chip gold" title="${CLAIM_TITLE}">${g.claimable} to claim</span>`);

function watch(g, now) {
  const stage = $("stage");
  const frame = `<iframe src="${WATCH}${BigInt(g.game_id)}" title="Game ${g.id} in the Loot Survivor spectator" allow="autoplay"></iframe>`;
  const wait = g.live && !now ? g.started_at + INDEXED_MS - Date.now() : 0;
  stage.className = "view";
  stage.dataset.id = g.id;
  stage.innerHTML = wait > 0 ? `<b class="wait">Game ${g.id} starts</b>` : frame;
  if (wait > 0) setTimeout(() => { if (stage.dataset.id === String(g.id) && !stage.querySelector("iframe")) stage.innerHTML = frame; }, wait);
}

function seatHtml(g) {
  const { state: s, move } = seen.get(g.id) ?? {};
  const head = `<header><span>Game ${g.id}</span><button type="button" data-details title="Open this game in the Loot Survivor spectator">Details</button></header>`;
  if (!s) return `${head}<span class="dim">Starting</span>`;
  const worn = Object.fromEntries(s.equipment.map((x) => [x.slot, x]));
  const b = s.beast;
  const last = s.happened.at(-1);
  return `${head}
    <div class="lvl"><b>${s.level}</b><span>Level<br>${s.toLevel} XP to ${s.level + 1}</span></div>
    <div class="hp${s.health < 0.3 * s.maxHealth ? " low" : ""}" title="Health"><i style="width:${(100 * s.health) / s.maxHealth}%"></i><span>${s.health} / ${s.maxHealth}</span></div>
    <div class="had"><span title="Gold">${pic("gold", "Gold")}${s.gold}</span>${slain(g)}${g.claimable ? `<span class="gold" title="${CLAIM_TITLE}">${g.claimable} to claim</span>` : ""}</div>
    <div class="now">${b ? `<img src="${face(b.baseName)}" alt=""><span><span class="${b.specialPrefix ? "gold" : ""}">${esc(b.name)}</span><small><span class="gold">T${b.tier}</span> level ${b.level}</small></span><b title="Its health">${b.health}</b>` : `<span class="${/hits your/.test(last) ? "bad" : "dim"}">${esc(plain(last ?? ""))}</span>`}</div>
    <div class="gear">${slots.map((slot) => (worn[slot] ? `<div class="card" title="${esc(`${worn[slot].name}, tier ${worn[slot].tier}, greatness ${worn[slot].greatness}`)}">${art(worn[slot].name)}<b>${worn[slot].greatness}</b></div>` : `<div class="card none" title="No ${slot}"><b></b></div>`)).join("")}</div>
    <div class="did">${move ? moveHtml(move) : ""}</div>`;
}

function seats(games) {
  const stage = $("stage");
  if (!stage.classList.contains("seats")) stage.innerHTML = "";
  stage.className = `seats ${games.length === 1 ? "one" : games.length <= 4 ? "few" : "many"}`;
  stage.style.setProperty("--cols", games.length <= 4 ? 2 : 4);
  delete stage.dataset.id;
  for (const el of [...stage.children]) if (!games.some((g) => String(g.id) === el.dataset.id)) el.remove();
  for (const g of games) {
    let seat = stage.querySelector(`[data-id="${g.id}"]`);
    if (!seat) {
      seat = stage.appendChild(Object.assign(document.createElement("article"), { className: "card seat" }));
      seat.dataset.id = g.id;
    }
    put(seat, seatHtml(g));
  }
}

function render() {
  const g = target();
  const stage = $("stage");
  if (!g && lives().length) seats(lives().sort((a, b) => a.id - b.id));
  else if (!g) { stage.className = ""; delete stage.dataset.id; stage.innerHTML = `<b class="wait">No real game yet</b>`; }
  else if (stage.dataset.id !== String(g.id)) watch(g);
  const live = g ? g.live : lives().length > 0;
  const now = g && seen.get(g.id);
  $("mode").className = live ? "live good" : g ? "bad" : "dim";
  $("mode").textContent = live ? "Live" : g ? "Ended" : "Idle";
  $("which").textContent = g ? `Game ${g.id}` : lives().length ? `${lives().length} ${lives().length === 1 ? "game" : "games"}` : "";
  put($("plan"), !g ? "" : g.live ? `<span class="chip" title="Named beasts slain this game"><img class="pic" src="${icon.skull}" alt="Named beasts slain">${g.beasts ?? 0}</span>${toClaim(g)}${now?.move ? planHtml(now.move, now.state?.market ?? []) : ""}` : endHtml(g));
  $("again").hidden = !g;
  $("golive").hidden = !lives().length || !g;

  const sums = data.summary ?? [];
  const sum = sums.find((x) => x.mode === keep("dungeon")) ?? sums.find((x) => x.mode === data.games[0]?.mode) ?? sums[0];
  const mode = sum?.mode;
  const inMode = data.games.filter((x) => x.mode === mode);
  const tile = (value, label, tone = "") => `<div class="card"><b class="${tone}">${value}</b><span class="dim">${label}</span></div>`;
  const figure = (n, digits) => (n == null ? "-" : round(n, digits));
  put($("sum"), !sum?.games ? "" : `<div id="reach">${tile(round(sum.games), "Games")}${tile(figure(sum.mean, 1), "Avg level")}${tile(figure(sum.slain, 1), "Slain each")}${tile(sum.usd == null ? "-" : `$${round(sum.usd, 2)}`, "Spent")}${tile(sum.best, "Best level")}${tile(round(sum.claimed), "Claimed")}</div>`);
  const liveRow = lives().length ? `<li class="card${g ? "" : " on"}" data-live tabindex="0" title="Live games and the best level among them"><img src="${mark(lives())}" alt=""><span>${lives().length} ${lives().length === 1 ? "game" : "games"}<span class="tag">Live</span></span><span></span><b>${Math.max(...lives().map((x) => x.level ?? 0))}</b></li>` : "";
  put($("modes"), `<h2>Games</h2><span class="seg">${sums.map((x) => `<button type="button" data-mode="${x.mode}" aria-pressed="${x.mode === mode}">${x.name.split(" ")[0]}</button>`).join("")}</span>`);
  const ranked = inMode.filter((x) => x.ended_at).sort((a, b) => b.level - a.level || b.id - a.id);
  const cls = (x) => `class="card${x.id === g?.id ? " on" : ""}" data-id="${x.id}" tabindex="0"`;
  put($("podium"), ranked.slice(0, 3).map((x) => `<li ${cls(x)} title="Game ${x.id}"><img src="${portrait(x)}" alt=""><b>${x.level}</b>${slain(x)}<span class="dim">${x.id}</span></li>`).join(""));
  put($("board"), !liveRow && !ranked.length ? `<li class="none">No games</li>` : liveRow + [...ranked.slice().sort((a, b) => b.started_at - a.started_at).slice(0, every ? undefined : LATEST)].map((x) => `<li ${cls(x)}><img src="${portrait(x)}" alt=""><span>Game ${x.id}</span>${slain(x)}<b>${x.level}</b></li>`).join("") + (!every && ranked.length > LATEST ? `<li class="more"><button type="button" data-more>More</button></li>` : ""));

  const c = data.check;
  const day = (ms) => new Date(ms).toLocaleDateString("en", { day: "numeric", month: "short", year: "numeric" });
  const warn = !c ? "" : c.failed ? `The engine no longer matches the contract since ${day(c.since ?? c.at)}` : Date.now() - c.at > CHECK_STALE_MS ? `The engine was last checked against the contract on ${day(c.at)}` : "";
  $("warn").hidden = !warn;
  $("warn").textContent = warn;
  $("warn").title = c?.failures?.join("\n") ?? "";

  const w = data.wallet;
  put($("wallet"), `<div class="head"><h2>Wallet</h2>${canPlay() ? `<span class="seg"><button type="button" data-play aria-pressed="${run.open}" title="Start or stop a run">Play</button></span>` : ""}</div>${!w ? "" : w.strk === undefined ? `<span class="bad">No answer</span>` : `<div class="big ${w.strk > w.floor ? "good" : "bad"}" title="The agent never spends below ${w.floor} STRK">${round(w.strk, 1)} <small>STRK</small></div>
    <div class="row"><span>${pic("dungeon_ticket", "Tickets")}<span class="n">${round(w.tickets, 1)}</span></span><span>${pic("survivor_token", "SURVIVOR tokens")}<span class="n">${round(w.survivor, 1)}</span></span></div>`}${data.cycle?.text ? `<div class="dim" title="${data.cycle.on ? "What the cycle does now" : "How the last cycle ended"}">Cycle: ${esc(data.cycle.text)}</div>` : ""}`);

  const b = data.beasts;
  const STATE = { held: "", staked: ", staked", mega: ", Mega", claim: ", to claim" };
  const cell = (x, collection) => `<div class="card ${x.state}" title="${esc(`${x.name}: tier ${x.tier} ${x.type}, level ${x.level}${STATE[x.state]}${x.strk === null ? "" : `, sells for ${round(x.strk, 1)} STRK`}`)}"><img src="${face(x.kind, collection)}" alt="${esc(x.name)}"><i>T${x.tier}</i><b>${x.level}</b></div>`;
  const tiers = (x) => x.tiers.map((n, i) => (n ? `<span><span class="gold">T${i + 1}</span> <span class="n">${round(n)}</span></span>` : "")).join("");
  const group = (x) => `<div class="head"><span><span class="dim">${x.name}</span><span class="n">${round(x.held)}</span>${x.claims ? `<span class="gold">${x.claims} to claim</span>` : ""}</span>${x.usd === null ? "" : `<span class="n" title="What the pools pay for them now, one at a time, at the STRK price Ekubo quotes">$${round(x.usd, 2)}</span>`}</div>${x.held ? `<div class="row tally">${tiers(x)}${x.mega ? `<span><span class="n">${x.mega}</span> Mega</span>` : ""}${x.staked ? `<span><span class="n">${x.staked}</span> staked</span>` : ""}</div>` : ""}${x.beasts.length ? `<div class="cells">${x.beasts.slice(0, STRIP).map((y) => cell(y, x.key)).join("")}</div>` : ""}`;
  put($("beasts"), `<div class="head"><h2>Beasts</h2><span class="n big">${b?.groups ? round(b.groups.reduce((n, x) => n + x.held, 0)) : ""}</span></div>${b?.failed ? `<span class="bad">No answer</span>` : ""}${b?.groups ? `<div id="zoo">${b.groups.map(group).join("")}</div>` : ""}`);

  const first = (text) => text.replace(/ (T\d|G\d).*$/, "");
  const age = (Date.now() - (data.bags?.at ?? NaN)) / 60_000;
  const since = isNaN(age) ? "" : age < 1 ? "now" : age < 60 ? `${Math.floor(age)} min ago` : age < 1440 ? `${Math.floor(age / 60)} h ago` : `${Math.floor(age / 1440)} d ago`;
  const sacks = [...(data.bags?.rows ?? [])].sort((a, b) => (b[bagSort] ?? -1) - (a[bagSort] ?? -1)).slice(0, BAGS);
  put($("bags"), `<div class="head"><h2>Loot bags</h2><span class="seg">${Object.entries(SORTS).map(([k, label]) => `<button type="button" data-sort="${k}" aria-pressed="${k === bagSort}">${label}</button>`).join("")}</span></div><div class="head"><span class="dim">${data.bags?.running ? "Ranking the pool's bags" : `Ranked ${since || "never"}`}</span></div><ol id="sacks" class="rows fit">${sacks.map((x) => `<li class="card" title="${esc(`Bag ${x.bag}: ${x.weapon}, ${x.set}, ${x.neck}, ${x.ring}`)}"><span class="dim">${x.bag}</span><span class="arts">${[x.weapon, x.neck, x.ring].map(first).filter((n) => byName[n]).map(art).join("")}</span><span>${x.n ? `x${x.n}` : ""}</span><b>${x[bagSort] === undefined ? "-" : round(x[bagSort], 1)}</b></li>`).join("")}</ol>`);
  if (run.open && run.key && run.rows !== forPlay().map((x) => x.bag).join()) panel();
  else sync();
}

const KEY = "playKey";
const run = { open: false, key: keep(KEY), beasts: 0, caps: new Map(), said: "", bad: false, ask: null, rows: "" };
const canPlay = () => !!run.key || location.hash === "#play";
const busy = () => lives().length > 0 || !!data.cycle?.on;
const forPlay = () => [...(data.bags?.rows ?? [])].sort((a, b) => (b.kills ?? -1) - (a.kills ?? -1)).slice(0, BAGS);
const perGame = (mode) => { const f = data.summary?.find((x) => x.mode === mode); return f?.games ? f.strk / f.games : null; };
const amount = (n, unit) => (n == null || isNaN(n) ? `? ${unit}` : `${round(n, n < 10 ? 1 : 0)} ${unit}`);

function cost(beasts, bags) {
  const price = data.bags?.price ?? null;
  const strk = (beasts ? beasts * (perGame("beast") ?? NaN) : 0) + (bags ? bags * (perGame("lootBag") ?? NaN) : 0);
  const survivor = bags * (price ?? NaN);
  const usd = data.wallet?.usd ? strk * data.wallet.usd[0] + (bags ? survivor * data.wallet.usd[1] : 0) : NaN;
  return { strk, survivor, usd };
}

function plan() {
  const caps = [...run.caps.values()];
  const c = cost(run.beasts, caps.length);
  const cap = caps.reduce((n, x) => n + x, 0);
  const parts = [run.beasts ? `${run.beasts} Beast game${run.beasts > 1 ? "s" : ""}` : "", caps.length ? `${caps.length} Loot bag${caps.length > 1 ? "s" : ""}` : ""].filter(Boolean).join(" and ");
  const bags = caps.length ? `at most ${amount(cap, "SURVIVOR")} for the bags${isNaN(c.survivor) ? "" : ` (${amount(c.survivor, "SURVIVOR")} now)`} and ` : "";
  return `Play ${parts}: ${bags}about ${amount(c.strk, "STRK")} in moves${isNaN(c.usd) ? "" : `, $${round(c.usd, 2)} at today's prices`}?`;
}

function cyclePlan() {
  const c = data.cycle;
  return `Run a cycle: ${c.beastGames} Beast games, about ${amount(cost(c.beastGames, 0).strk, "STRK")} in moves, then the best bag if it costs at most ${c.bagCapSurvivor} SURVIVOR${data.bags?.price == null ? "" : ` (${amount(data.bags.price, "SURVIVOR")} now)`}?`;
}

function panel() {
  const el = $("run");
  el.hidden = !run.open;
  if (!run.open) return;
  if (!run.key) {
    el.innerHTML = `<form><label>Key <input type="password" name="key" autocomplete="current-password" required></label><span class="seg"><button>Check</button></span></form><p class="${run.bad ? "bad" : "dim"}">${esc(run.said || "The key the service was started with. This browser keeps it.")}</p>`;
    return el.querySelector("input").focus();
  }
  const rows = forPlay();
  run.rows = rows.map((x) => x.bag).join();
  for (const bag of run.caps.keys()) if (!rows.some((x) => x.bag === bag)) run.caps.delete(bag);
  const cap = data.cycle?.bagCapSurvivor ?? "";
  el.innerHTML = `    <label>Beast games <input type="number" data-beasts min="0" step="1" value="${run.beasts}"></label>
    <div class="head"><span>Loot bags <small class="dim" data-each></small></span><span class="seg"><button type="button" data-act="rank" title="Rank the bags new in the pool">Refresh</button></span></div>
    <ol id="picks" class="fit">${rows.map((x) => `<li class="card${run.caps.has(x.bag) ? " on" : ""}" data-row="${x.bag}"><input type="checkbox" data-bag="${x.bag}" aria-label="Bag ${x.bag}" ${run.caps.has(x.bag) ? "checked" : ""}><span><span class="dim">${x.bag}</span> ${x.kills === undefined ? "-" : round(x.kills, 1)} kills${x.n > 1 ? ` <span class="dim">x${x.n}</span>` : ""}</span><input type="number" class="cap" data-cap="${x.bag}" min="1" step="1" value="${run.caps.get(x.bag) ?? cap}" title="Most SURVIVOR to pay for this bag" aria-label="SURVIVOR cap for bag ${x.bag}" ${run.caps.has(x.bag) ? "" : "disabled"}></li>`).join("") || `<li class="dim">No ranked bag for sale</li>`}</ol>
    <p data-spend></p><div class="acts" data-acts></div><div class="head"><span data-said></span><button type="button" class="link" data-forget>Forget key</button></div>`;
  sync();
}

function sync() {
  const el = $("run");
  if (!run.open || !run.key || !el.querySelector("[data-acts]")) return;
  const price = data.bags?.price;
  const w = data.wallet;
  el.querySelector("[data-each]").textContent = data.bags?.running ? "ranking the pool" : `by named kills${price == null ? "" : `, ${round(price, 1)} SURVIVOR each`}`;
  el.querySelector("[data-act=rank]").disabled = !!data.bags?.running;
  for (const li of el.querySelectorAll("[data-row]")) li.classList.toggle("over", price != null && run.caps.has(+li.dataset.row) && price > run.caps.get(+li.dataset.row));
  const c = cost(run.beasts, run.caps.size);
  const spendable = w?.strk === undefined ? null : Math.max(0, w.strk - w.floor);
  const short = (need, have) => (have != null && need > have ? "bad" : "");
  put(el.querySelector("[data-spend]"), run.beasts || run.caps.size ? `About <span class="${short(c.strk, spendable)}">${amount(c.strk, "STRK")}</span> in moves, of ${amount(spendable, "STRK")} spendable${run.caps.size ? `, and <span class="${short(c.survivor, w?.survivor)}">${amount(c.survivor, "SURVIVOR")}</span> for bags, of ${amount(w?.survivor, "SURVIVOR")} held` : ""}${isNaN(c.usd) ? "" : `: $${round(c.usd, 2)} at today's prices`}.` : `<span class="dim">Pick Beast games or bags. Moves cost what past games cost on average.</span>`);
  const going = busy();
  put(el.querySelector("[data-acts]"), run.ask ? `<button type="button" class="go" data-act="yes">Spend</button><button type="button" data-act="back">Back</button>` : `<button type="button" class="go" data-act="play" ${going || !(run.beasts || run.caps.size) ? "disabled" : ""}>Play</button><button type="button" data-act="cycle" ${going || !data.cycle ? "disabled" : ""}>Cycle</button>${going ? `<button type="button" class="stop" data-act="stop">Stop</button>` : ""}`);
  put(el.querySelector("[data-said]"), run.ask ? `<span class="gold">${esc(run.ask.text)}</span>` : run.said ? `<span class="${run.bad ? "bad" : "dim"}">${esc(run.said)}</span>` : "");
}

const tell = (text, bad = false) => { run.said = text; run.bad = bad; panel(); };
const auth = () => (run.key ? { authorization: `Bearer ${run.key}` } : {});

function forget() {
  run.key = null;
  try { localStorage.removeItem(KEY); } catch {}
}

async function check(key) {
  const res = await fetch("/api/auth", { headers: { authorization: `Bearer ${key}` } }).catch(() => null);
  if (res?.status === 204) {
    run.key = key;
    keep(KEY, key);
    run.said = "";
    return panel();
  }
  tell(!res ? "No answer from the service" : res.status === 401 ? "Wrong key" : res.status === 403 ? "The service has no key set" : `The service cannot check the key (${res.status})`, true);
}

async function send(path, body, done) {
  run.ask = null;
  const res = await fetch(path, { method: "POST", headers: auth(), body: JSON.stringify(body) }).catch(() => null);
  if (!res) return tell("No answer from the service", true);
  const text = (await res.text()).trim();
  if (res.status === 401) { forget(); return tell("The service refused the key", true); }
  if (res.status === 403) return tell(text || "The service has no key set", true);
  if (!res.ok) return tell(text || `Refused (${res.status})`, true);
  tell(done);
  load();
  loadSide();
}

const seatsOf = () => [...Array.from({ length: run.beasts }, () => ({ dungeon: "beast" })), ...[...run.caps].map(([bag, maxSurvivor]) => ({ dungeon: "lootBag", bag, maxSurvivor }))];
const ACTS = {
  play: () => { run.ask = { text: plan(), go: () => send("/api/play", { seats: seatsOf() }, "Started") }; sync(); },
  cycle: () => { run.ask = { text: cyclePlan(), go: () => send("/api/cycle", {}, "Cycle started") }; sync(); },
  stop: () => send("/api/stop", {}, "Stopping after the current move"),
  rank: () => send("/api/bags", {}, "Ranking the bags new in the pool"),
  yes: () => run.ask?.go(),
  back: () => { run.ask = null; sync(); },
};

$("run").onsubmit = (e) => { e.preventDefault(); check(e.target.key.value.trim()); };
$("run").onclick = (e) => {
  if (e.target.closest("[data-forget]")) { forget(); run.said = ""; return panel(); }
  const act = e.target.closest("[data-act]");
  if (act) ACTS[act.dataset.act]();
};
$("run").oninput = (e) => {
  const t = e.target;
  run.ask = null;
  if (t.dataset.beasts !== undefined) run.beasts = Math.max(0, Math.floor(+t.value || 0));
  if (t.dataset.cap && run.caps.has(+t.dataset.cap)) run.caps.set(+t.dataset.cap, +t.value || 0);
  if (t.dataset.bag) {
    const bag = +t.dataset.bag;
    const cap = t.closest("li").querySelector(".cap");
    if (t.checked) run.caps.set(bag, +cap.value || 0); else run.caps.delete(bag);
    cap.disabled = !t.checked;
    t.closest("li").classList.toggle("on", t.checked);
  }
  sync();
};
$("wallet").onclick = (e) => {
  if (!e.target.closest("[data-play]")) return;
  run.open = !run.open;
  run.said = "";
  run.ask = null;
  $("beasts").hidden = $("bags").hidden = run.open;
  render();
  panel();
  if (run.open) $("wallet").scrollIntoView({ block: "nearest" });
};

let due;
const soon = () => { clearTimeout(due); due = setTimeout(load, ROUND_MS); };

async function load() {
  const [games, summary] = await Promise.all([get("/api/games"), get("/api/summary")]);
  Object.assign(data, { games: games ?? data.games, summary: summary ?? data.summary });
  for (const id of seen.keys()) if (!lives().some((g) => g.id === id)) seen.delete(id);
  for (const g of lives()) {
    if (seen.has(g.id)) continue;
    seen.set(g.id, { at: 0 });
    get(`/api/games/${g.id}`).then((found) => { for (const e of found?.events ?? []) track(e); render(); });
  }
  render();
}

async function loadSide() {
  const [w, b, c, bags, cycle] = await Promise.all(["wallet", "beasts", "check", "bags", "cycle"].map((p) => get(`/api/${p}`)));
  Object.assign(data, { wallet: w ?? data.wallet, beasts: b ?? data.beasts, check: c ?? data.check, bags: bags ?? data.bags, cycle: cycle ?? data.cycle });
  render();
  if (data.bags?.running) setTimeout(loadSide, RANKING_MS);
}

function track(e) {
  const game = seen.get(e.row);
  if (!game || e.at < game.at) return;
  game.at = e.at;
  if (e.kind === "decision") game.move = e;
  else if (e.kind === "state") game.state = e.state;
}

function go(search) {
  history.pushState(null, "", search || location.pathname);
  render();
}

const pick = (e) => { const m = e.target.closest("[data-mode]"); if (m) { keep("dungeon", m.dataset.mode); every = false; return render(); } if (e.target.closest("[data-more]")) { every = true; return render(); } if (e.target.closest("[data-live]")) return go(""); const row = e.target.closest("li[data-id]"); if (row) go(`?game=${row.dataset.id}`); };
$("games").onclick = pick;
$("games").onkeydown = (e) => { if (e.key === "Enter") pick(e); };
$("bags").onclick = (e) => { const b = e.target.closest("[data-sort]"); if (b) { bagSort = b.dataset.sort; keep("bagSort", bagSort); render(); } };
$("again").onclick = () => watch(target(), true);
$("stage").onclick = (e) => { if (e.target.closest("[data-details]")) go(`?game=${e.target.closest(".seat").dataset.id}`); };
$("golive").onclick = () => go("");
addEventListener("popstate", render);
addEventListener("hashchange", render);

const source = new EventSource("/events");
source.onopen = load;
source.onmessage = (m) => {
  const e = JSON.parse(m.data);
  if (e.kind === "cycle") { data.cycle = e; return render(); }
  if (e.kind === "status") return load();
  if (seen.has(e.row)) { track(e); render(); }
  if (e.kind === "state" && lives().length) soon();
};
Promise.all([get("/api/items"), load()]).then(([table]) => {
  for (const g of table ?? []) { items[g.id] = g; byName[g.name] = g; }
  slots = [...new Set((table ?? []).map((g) => g.slot))];
  loadSide();
});
setInterval(loadSide, SLOW_MS);
</script>
</body>
</html>
