<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loot Survivor agent</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap" rel="stylesheet">
<style>
:root {
  --void: #030402; --raise: #171d13; --edge: #2c3725; --bone: #e8dcc4; --dim: #a39a82;
  --gold: #ffe97f; --lime: #80ff00; --blood: #ff5a47;
  --num: "Jersey 20", system-ui, sans-serif;
  --bevel: inset 0 2px 0 rgb(255 255 255 / 0.07), inset 0 -3px 0 rgb(0 0 0 / 0.5);
  --drop: 0 4px 0 rgb(0 0 0 / 0.7), 0 10px 22px rgb(0 0 0 / 0.55);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: clamp(14px, min(0.84vw, 1.5vh), 20px); height: 100%; }
body { height: 100%; background: var(--void); color: var(--bone); font: 400 1.3rem/1.1 var(--num); padding: 0.8rem; overflow: hidden; }
img { image-rendering: pixelated; display: block; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
ol { list-style: none; }
h2 { font: 400 1.9rem/1 var(--num); color: var(--gold); letter-spacing: 0.04em; }
.good { color: var(--lime); } .bad { color: var(--blood); } .gold { color: var(--gold); } .dim { color: var(--dim); }
.n { font-family: var(--num); font-size: 1.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.ic { display: inline-block; width: 1.6rem; height: 1.6rem; flex: none; background: currentColor; -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }
.pic { width: 1.6rem; height: 1.6rem; flex: none; object-fit: contain; }

.win { height: 100%; display: grid; grid-template-columns: 21rem minmax(0, 1fr) 21rem; gap: 0.8rem; }
.panel { background: linear-gradient(#11160e, #0a0d08); border: 2px solid var(--edge); border-radius: 6px; box-shadow: var(--bevel), var(--drop); padding: 1rem; display: flex; flex-direction: column; gap: 1rem; min-height: 0; }
section { display: flex; flex-direction: column; gap: 0.5rem; min-height: 0; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
.card { background: var(--raise); border: 2px solid var(--edge); border-radius: 4px; box-shadow: var(--bevel), 0 3px 0 rgb(0 0 0 / 0.6); }
.scroll { overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--edge) transparent; padding: 0 0.2rem 0.3rem 0; }
.rows { display: flex; flex-direction: column; gap: 0.4rem; }
.rows li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.6rem; padding: 0.25rem 0.7rem 0.25rem 0.4rem; }
.rows b { font: 400 2rem/1 var(--num); color: var(--gold); }
.rows img { width: 2.4rem; height: 2.4rem; object-fit: contain; }
.tag { padding: 0 0.35rem; border-radius: 3px; background: var(--lime); color: #000; margin-left: 0.4rem; }

#logo { width: 11rem; image-rendering: auto; margin: -0.2rem auto 0; }
#games { flex: 1; }
.rows li.none { display: block; text-align: center; padding: 2rem 0; color: var(--dim); font-size: 1.6rem; }
#podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; align-items: end; }
#podium li { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; padding: 0.5rem 0.2rem 0.6rem; }
#podium li:nth-child(1) { order: 2; padding-top: 0.9rem; padding-bottom: 1.5rem; border-color: #6d6335; }
#podium li:nth-child(2) { order: 1; } #podium li:nth-child(3) { order: 3; }
#podium img { width: 3.6rem; height: 3.6rem; object-fit: contain; filter: drop-shadow(0 3px 0 rgb(0 0 0 / 0.7)); }
#podium b { font: 400 2.6rem/0.9 var(--num); color: var(--gold); }
#games li { cursor: pointer; }
#games li:hover { background: #1e2619; }
#games li.on { border-color: var(--gold); box-shadow: var(--bevel), 0 0 0 2px var(--gold), 0 3px 0 rgb(0 0 0 / 0.6); }
#results { flex: none; }
#reach { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
#reach div { text-align: center; padding: 0.4rem 0 0.5rem; }
#reach b { display: block; font: 400 2rem/1 var(--num); color: var(--lime); }

#mid { display: flex; flex-direction: column; gap: 0.8rem; min-width: 0; min-height: 0; }
#stage { position: relative; flex: 1; min-height: 0; border: 2px solid var(--edge); border-radius: 6px; box-shadow: var(--drop); background: #000; overflow: hidden; display: grid; place-content: center; text-align: center; }
#stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
#stage b { font: 400 4rem/1 var(--num); color: var(--gold); }
#dock { flex: none; flex-direction: row; align-items: center; gap: 0.7rem; padding: 0.6rem 0.8rem; min-height: 4.6rem; }
#mode { font: 400 1.7rem/1 var(--num); letter-spacing: 0.06em; white-space: nowrap; }
#mode::before { content: ""; display: inline-block; width: 0.6rem; height: 0.6rem; margin-right: 0.4rem; background: currentColor; vertical-align: 0.12em; }
#mode.live::before { animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.15; } }
#which { white-space: nowrap; }
#plan { flex: 1; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.5rem; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 0.4rem; height: 3rem; padding: 0 0.8rem; font: 400 1.6rem/1 var(--num); background: var(--raise); border: 2px solid var(--edge); border-radius: 4px; box-shadow: var(--bevel), 0 3px 0 rgb(0 0 0 / 0.6); white-space: nowrap; }
.chip .pic { width: 2.2rem; height: 2.2rem; }
.chip small { font-size: 1.25rem; color: var(--dim); }
.chip.on { color: var(--gold); border-color: var(--gold); }
.chip.off { color: var(--dim); opacity: 0.7; }
.chip.out img { filter: grayscale(1) brightness(0.6); }
#golive { color: #000; background: var(--lime); border-radius: 3px; padding: 0.2rem 0.6rem; white-space: nowrap; }

#run { flex: none; height: 3.6rem; font: 400 2.1rem/1 var(--num); letter-spacing: 0.08em; color: #000; background: linear-gradient(#b6ff5c 0 12%, var(--lime) 12% 80%, #4fa800 80%); border: 2px solid #000; border-radius: 4px; box-shadow: 0 0 0 2px #2f5c00, var(--drop); }
#run.stop { background: linear-gradient(#ff9a8c 0 12%, var(--blood) 12% 80%, #a32a1c 80%); box-shadow: 0 0 0 2px #5c1a12, var(--drop); }
#run:active { transform: translateY(2px); }
.big { font: 400 3.2rem/0.9 var(--num); }
.big small { font-size: 1.3rem; color: var(--dim); }
.row { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; align-items: center; }
.row > span { display: inline-flex; align-items: center; gap: 0.35rem; }
#zoo { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem; max-height: 11rem; }
#zoo div { position: relative; aspect-ratio: 1; padding: 0.15rem; }
#zoo img { width: 100%; height: 100%; object-fit: contain; }
#zoo b { position: absolute; right: 0.2rem; bottom: 0; font: 400 1.2rem/1 var(--num); text-shadow: 0 2px 0 #000, 2px 0 0 #000, -2px 0 0 #000; }
#bags { flex: 1; }
#sacks .arts { display: flex; gap: 0.15rem; }
#sacks img { width: 2rem; height: 2rem; }
#sacks li { padding-left: 0.7rem; grid-template-columns: auto 1fr auto 3.4rem; }
#sacks b { text-align: right; }
.seg { display: flex; gap: 0.3rem; }
.seg button { padding: 0 0.5rem; border: 2px solid var(--edge); border-radius: 3px; color: var(--dim); }
.seg button[aria-pressed="true"] { color: #000; background: var(--gold); border-color: var(--gold); }

dialog { margin: auto; width: min(34rem, calc(100vw - 2rem)); color: var(--bone); background: linear-gradient(#141a10, #0a0d08); border: 2px solid var(--edge); border-radius: 6px; box-shadow: var(--bevel), 0 0 0 2px #000, 0 20px 60px #000; padding: 1.4rem; }
dialog::backdrop { background: rgb(0 0 0 / 0.78); }
dialog h2 { text-align: center; margin-bottom: 1rem; font-size: 2.4rem; color: var(--blood); }
.cost { justify-content: center; margin-bottom: 1.1rem; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
.pick button { padding: 1.1rem 0.5rem; font: 400 2rem/1 var(--num); }
.pick button:hover { border-color: var(--gold); }
.pick button.spend { color: var(--blood); border-color: #7a2a20; }

@media (max-width: 900px) {
  body { height: auto; overflow: auto; padding: 0.5rem; }
  .win { display: flex; flex-direction: column; height: auto; }
  #mid { order: -1; }
  #stage { flex: none; height: 78svh; }
  #dock { flex-wrap: wrap; }
  #board, #sacks { max-height: 22rem; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="win">
  <aside class="panel">
    <img id="logo" src="/assets/logo.png" alt="Loot Survivor">
    <section id="games"><div class="head" id="modes"></div><ol id="podium"></ol><ol id="board" class="rows scroll"></ol></section>
    <section id="results"></section>
  </aside>
  <main id="mid">
    <div id="stage"></div>
    <div class="panel" id="dock"><span id="mode"></span><span id="which"></span><div id="plan"></div><button type="button" id="golive" hidden>Live</button></div>
  </main>
  <aside class="panel">
    <section id="wallet"></section>
    <section id="beasts"></section>
    <section id="bags"></section>
  </aside>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const post = (url, body) => fetch(url, { method: "POST", body: body && JSON.stringify(body) });
const get = (url) => fetch(url).then((r) => (r.ok ? r.json() : null)).catch(() => null);
const round = (n, digits = 0) => Number(n).toLocaleString("en", { maximumFractionDigits: digits });
const put = (el, html) => { if (el.html !== html) el.innerHTML = el.html = html; };
const title = (word) => word[0].toUpperCase() + word.slice(1);
const stat = (name) => `<i class="ic" style="--i:url(/assets/icons/${title(name)}.svg)" title="${title(name)}"></i>`;
const pic = (name, label) => `<img class="pic" src="/assets/icons/${name}.png" alt="${label}" title="${label}">`;
const art = (name) => `<img class="pic" src="/assets/loot/${name.toLowerCase().replace(/[^a-z0-9]+/g, "_")}.png" alt="${esc(name)}" title="${esc(name)}">`;
const face = (name) => (/^[A-Za-z]+$/.test(name ?? "") ? `/assets/beasts/${name.toLowerCase()}.png` : "/assets/skull.png");
const killer = (g) => (g.ending ?? "").match(/against (?:".*" )?(\w+) level (\d+)$/);

const WATCH = "https://www.lootsurvivor.io/watch?id=";
const MOVES = { attack: "Fight", flee: "Flee", explore: "Explore" };
const SLOW_MS = 60_000;
const BAGS = 25;
const SORTS = { mean: "Level", kills: "Beasts" };
const keep = (key, value) => { try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch { return null; } };
let bagSort = keep("bagSort") in SORTS ? keep("bagSort") : "mean";

const items = {};
const byName = {};
const data = { games: [], wallet: null, beasts: null, results: null, bags: null, check: null };
let shown = null;
let move = null;
let market = [];

const liveGame = () => data.games.find((g) => g.live);
const liveReal = () => data.games.find((g) => g.live && g.onchain);
const realGames = () => data.games.filter((g) => g.onchain);
const picked = () => Number(new URLSearchParams(location.search).get("game")) || null;
const target = () => realGames().find((g) => g.id === picked()) ?? liveReal() ?? realGames()[0] ?? null;

function planHtml(e) {
  const last = e.actions.at(-1)?.type;
  if (e.phase === "battle") {
    const odds = e.thought.match(/(\d+)% to win the fight, (\d+)% to escape/);
    return ["attack", "flee"].map((m, i) => `<span class="chip ${m === last ? "on" : "off"}">${MOVES[m]}${odds ? ` ${odds[i + 1]}%` : ""}</span>`).join("");
  }
  const why = (name) => e.thought.match(new RegExp(`${name} \\(([^)]*)\\)`))?.[1].replace(/\bT(\d)/g, "tier $1") ?? "";
  return e.actions.map((a) => {
    const g = items[a.item];
    const price = market.find((m) => m.id === a.item)?.price;
    if (a.type === "upgrade") return `<span class="chip">${stat(a.stat)}+${a.amount}</span>`;
    if (a.type === "potions") return `<span class="chip">${pic("potion", "Potions")}x${a.qty}</span>`;
    if (a.type === "buy" && g) return `<span class="chip">${art(g.name)}${price ? `${pic("gold", "Gold")}${price}` : ""}<small>${esc(why(g.name))}</small></span>`;
    if (a.type === "equip" && g) return `<span class="chip">${art(g.name)}<small>${esc(why(g.name))}</small></span>`;
    if (a.type === "drop" && g) return `<span class="chip out">${art(g.name)}<small>Dropped</small></span>`;
    return MOVES[a.type] ? `<span class="chip on">${MOVES[a.type]}</span>` : "";
  }).join("");
}

function endHtml(g) {
  const k = killer(g);
  return `<span class="chip">Level ${g.level}</span>${k ? `<span class="chip"><img class="pic" src="${face(k[1])}" alt="">${k[1]} ${k[2]}</span>` : ""}${g.gas_strk === null ? "" : `<span class="chip">${round(g.gas_strk, 1)}<small>STRK</small></span>`}<span class="dim">Click the game, then press the right arrow to replay it</span>`;
}

function render() {
  const g = target();
  const live = liveGame();
  if (g?.id !== shown?.id) {
    shown = g;
    move = null;
    market = [];
    put($("stage"), g ? `<iframe src="${WATCH}${BigInt(g.game_id)}" title="Game ${g.id} in the Loot Survivor spectator" allow="autoplay"></iframe>` : `<b>No real game yet</b>`);
    if (g?.live) get(`/api/games/${g.id}`).then((found) => { for (const e of found?.events ?? []) onEvent(e); render(); });
  }
  $("mode").className = g?.live ? "live good" : g ? "bad" : "dim";
  $("mode").textContent = g?.live ? "Live" : g ? "Ended" : "Idle";
  $("which").textContent = g ? `Game ${g.id}` : "";
  put($("plan"), !g ? "" : g.live ? (move ? planHtml(move) : "") : endHtml(g));
  $("golive").hidden = !liveReal() || g?.live;
  if ($("run")) { $("run").textContent = live ? "Stop" : "Play"; $("run").className = live ? "stop" : ""; }

  const modes = data.beasts?.collections ?? {};
  const mode = keep("dungeon") in modes ? keep("dungeon") : (liveReal() ?? realGames()[0])?.mode;
  const inMode = realGames().filter((x) => x.mode === mode);
  const liveHere = inMode.find((x) => x.live);
  put($("modes"), `<h2>Games</h2><span class="seg">${Object.entries(modes).map(([k, name]) => `<button type="button" data-mode="${k}" aria-pressed="${k === mode}">${name.split(" ")[0]}</button>`).join("")}</span>`);
  const ranked = inMode.filter((x) => !x.live).sort((a, b) => b.level - a.level || b.id - a.id);
  const cls = (x) => `card${x.id === g?.id ? " on" : ""}`;
  put($("podium"), ranked.slice(0, 3).map((x) => `<li class="${cls(x)}" data-id="${x.id}" tabindex="0" title="Game ${x.id}"><img src="${face(killer(x)?.[1])}" alt=""><b>${x.level}</b><span class="dim">${x.id}</span></li>`).join(""));
  put($("board"), !inMode.length ? `<li class="none">No games</li>` : [...(liveHere ? [liveHere] : []), ...ranked.slice(3).sort((a, b) => b.started_at - a.started_at)].map((x) => `<li class="${cls(x)}" data-id="${x.id}" tabindex="0"><img src="${x.live ? "/assets/favicon.png" : face(killer(x)?.[1])}" alt=""><span>Game ${x.id}${x.live ? `<span class="tag">Live</span>` : ""}</span><b>${x.live ? "" : x.level}</b></li>`).join(""));

  const l = data.results?.[0];
  const c = data.check;
  put($("results"), `<div class="head"><h2>Practice</h2>${c ? (c.failed ? `<span class="bad" title="${esc(c.failed)}">Check failed</span>` : `<span class="good" title="The local game matches the one on Starknet">Checked</span>`) : ""}</div>
    ${l ? `<div id="reach">${l.reach.map((r) => `<div class="card" title="Share of ${l.games} practice games that reached level ${r.level}"><b>${Math.round(100 * r.share)}%</b><span class="dim">Level ${r.level}</span></div>`).join("")}</div>` : ""}`);

  const w = data.wallet;
  const paid = realGames().filter((x) => x.gas_strk !== null);
  const each = paid.length ? paid.reduce((n, x) => n + x.gas_strk, 0) / paid.length : null;
  put($("wallet"), `<h2>Wallet</h2>${!w ? "" : w.strk === undefined ? `<span class="bad">No answer</span>` : `<div class="big ${w.strk > w.floor ? "good" : "bad"}" title="The agent never spends below ${w.floor} STRK">${round(w.strk, 1)} <small>STRK</small></div>
    <div class="row"><span>${pic("dungeon_ticket", "Tickets")}<span class="n">${round(w.tickets, 1)}</span></span><span>${pic("survivor_token", "SURVIVOR tokens")}<span class="n">${round(w.survivor, 1)}</span></span>${each === null ? "" : `<span class="dim" title="Average cost of a real game"><span class="n">${round(each, 1)}</span>a game</span>`}</div>`}`);

  const b = data.beasts;
  const held = Object.values(b?.inventory ?? {}).flat();
  const claims = b?.pendingClaims ?? [];
  const cell = (x) => `<div class="card" title="${esc(`${x.name}, level ${x.level}`)}"><img src="${face(x.name.split(" ").at(-1))}" alt="${esc(x.name)}"><b>${x.level}</b></div>`;
  put($("beasts"), `<div class="head"><h2>Beasts</h2><span class="n big">${b?.inventory ? held.length : ""}</span></div>${b && !b.inventory ? `<span class="bad">No answer</span>` : ""}${claims.length ? `<span class="gold">${claims.length} to claim</span>` : ""}${held.length + claims.length ? `<div id="zoo" class="scroll">${[...held, ...claims].map(cell).join("")}</div>` : ""}`);

  const first = (text) => text.replace(/ (T\d|G\d).*$/, "");
  const sacks = [...(data.bags ?? [])].sort((a, b) => (b[bagSort] ?? -1) - (a[bagSort] ?? -1)).slice(0, BAGS);
  put($("bags"), `<div class="head"><h2>Loot bags</h2><span class="seg">${Object.entries(SORTS).map(([k, label]) => `<button type="button" data-sort="${k}" aria-pressed="${k === bagSort}">${label}</button>`).join("")}</span></div><ol id="sacks" class="rows scroll">${sacks.map((x) => `<li class="card" title="${esc(`Bag ${x.bag}: ${x.weapon}, ${x.set}, ${x.neck}, ${x.ring}`)}"><span class="dim">${x.bag}</span><span class="arts">${[x.weapon, x.neck, x.ring].map(first).filter((n) => byName[n]).map(art).join("")}</span><span>x${x.n}</span><b>${x[bagSort] === undefined ? "-" : round(x[bagSort], 1)}</b></li>`).join("")}</ol>`);
}

function askHtml() {
  const paid = realGames().find((g) => g.gas_strk !== null);
  const w = data.wallet;
  return `<h2>This spends real money</h2>
    <div class="row cost">${paid ? `<span>Last game <span class="n bad">${round(paid.gas_strk, 1)} STRK</span></span>` : ""}${w?.strk !== undefined ? `<span>Wallet <span class="n ${w.strk > w.floor ? "good" : "bad"}">${round(w.strk, 1)} STRK</span></span>` : ""}</div>
    <div class="pick"><button class="card spend" type="button" data-do="spend">Spend STRK</button><button class="card" type="button" data-close autofocus>Cancel</button></div>`;
}

async function load() {
  data.games = (await get("/api/games")) ?? data.games;
  render();
}

async function loadSide() {
  const [w, b, l, c, bags] = await Promise.all(["wallet", "beasts", "strategies", "check", "bags"].map((p) => get(`/api/${p}`)));
  Object.assign(data, { wallet: w ?? data.wallet, beasts: b ?? data.beasts, results: l ?? data.results, check: c, bags: bags ?? data.bags });
  render();
}

function onEvent(e) {
  if (e.kind === "decision") move = e;
  else if (e.kind === "state") market = e.state.market;
}

function go(search) {
  history.pushState(null, "", search || location.pathname);
  render();
}

const pick = (e) => { const m = e.target.closest("[data-mode]"); if (m) { keep("dungeon", m.dataset.mode); return render(); } const row = e.target.closest("li[data-id]"); if (row) go(Number(row.dataset.id) === liveReal()?.id ? "" : `?game=${row.dataset.id}`); };
$("games").onclick = pick;
$("games").onkeydown = (e) => { if (e.key === "Enter") pick(e); };
$("bags").onclick = (e) => { const b = e.target.closest("[data-sort]"); if (b) { bagSort = b.dataset.sort; keep("bagSort", bagSort); render(); } };
$("golive").onclick = () => go("");
function control() {
  $("wallet").insertAdjacentHTML("beforebegin", `<button type="button" id="run"></button>`);
  document.body.insertAdjacentHTML("beforeend", `<dialog id="ask"></dialog>`);
  $("run").onclick = () => {
    if (liveGame()) return post("/api/stop");
    $("ask").innerHTML = askHtml();
    $("ask").showModal();
  };
  $("ask").onclick = (e) => {
    const spend = e.target.closest("[data-do]");
    if (spend) post("/api/play", { live: true });
    if (spend || e.target.closest("[data-close]") || e.target === $("ask")) { $("ask").close(); if (spend) go(""); }
  };
  render();
}
addEventListener("popstate", render);

const source = new EventSource("/events");
source.onopen = load;
source.onmessage = (m) => {
  const e = JSON.parse(m.data);
  if (e.kind === "status") return load();
  if (shown?.live) { onEvent(e); render(); }
};
Promise.all([get("/api/items"), load()]).then(([table]) => {
  for (const g of table ?? []) { items[g.id] = g; byName[g.name] = g; }
  loadSide();
});
setInterval(loadSide, SLOW_MS);
get("/api/me").then((me) => { if (me?.control) control(); });
</script>
