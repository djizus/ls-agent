<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Death Mountain Agent</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --bg: #111111; --panel: #1b1a1c; --well: #282729; --line: #3a372f; --gold: #d0c98d; --bright: #edcf33; --orange: #f59100; --text: #d0c98d; --dim: rgba(208, 201, 141, .55); --hp: #80ff00; --bad: #e0503c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(ellipse at top, #1e1c18 0%, var(--bg) 60%) fixed; color: var(--text); font: 15px/1.4 Cinzel, Georgia, serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header img { width: 32px; height: 32px; image-rendering: pixelated; }
  h1 { font-size: 20px; margin: 0 auto 0 0; letter-spacing: .06em; font-weight: 700; color: var(--bright); }
  #status { color: var(--dim); font: 18px VT323, monospace; }
  button { background: var(--well); color: var(--gold); border: 1px solid var(--line); border-radius: 4px; padding: 6px 14px; font: 600 13px Cinzel, serif; letter-spacing: .04em; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button.primary { background: var(--gold); color: #111; border-color: var(--gold); }
  main { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; min-width: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin: 0 0 10px; font-weight: 600; }
  .big { font-size: 26px; font-weight: 700; color: var(--bright); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .pix { font: 18px/1.2 VT323, monospace; }
  .dim { color: var(--dim); }
  .bar { height: 10px; background: var(--well); border: 1px solid var(--line); margin: 6px 0 12px; }
  .bar > div { height: 100%; background: var(--hp); transition: width .3s; }
  .beast { display: flex; gap: 12px; align-items: center; background: var(--well); border-left: 3px solid var(--bad); padding: 8px; margin-bottom: 12px; }
  .beast img { width: 72px; height: 72px; object-fit: contain; }
  .beast b { color: var(--bad); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .stats span { display: flex; align-items: center; gap: 6px; background: var(--well); padding: 4px 6px; }
  .stats img { width: 16px; height: 16px; }
  .gear { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .gear div { display: flex; align-items: center; gap: 6px; background: var(--well); padding: 4px; font-size: 12px; min-width: 0; }
  .gear img { width: 32px; height: 32px; flex: none; }
  .gear small { display: block; color: var(--dim); font: 15px VT323, monospace; }
  #feed { height: 64vh; overflow-y: auto; font: 18px/1.25 VT323, monospace; }
  #feed div { padding: 3px 0; border-bottom: 1px solid #262420; overflow-wrap: anywhere; }
  .k-say { color: var(--gold); }
  .k-thinking { color: var(--dim); }
  .k-tool { color: var(--bright); }
  .k-result { color: #8f8a68; }
  .k-status { color: var(--hp); }
  .k-turn { color: var(--orange); }
  table { width: 100%; border-collapse: collapse; font: 18px VT323, monospace; }
  td, th { text-align: right; padding: 3px 8px; border-bottom: 1px solid #262420; }
  th { color: var(--dim); font: 600 12px Cinzel, serif; letter-spacing: .06em; text-transform: uppercase; }
  td:first-child, th:first-child { text-align: left; }
  .wide { grid-column: 1 / -1; }
  .tablewrap { overflow-x: auto; max-height: 50vh; }
</style>
</head>
<body>
<header>
  <img src="/assets/skull.png" alt="">
  <h1>Death Mountain Agent</h1>
  <span id="status">connecting…</span>
  <button class="primary" onclick="play(10)">Play 10 practice games</button>
  <button onclick="play(1)">Play 1</button>
  <button onclick="post('/api/stop')">Stop</button>
</header>
<main>
  <section>
    <h2>Adventurer</h2>
    <div id="adv" class="dim">No game yet.</div>
  </section>
  <section>
    <h2>Live</h2>
    <div id="feed"></div>
  </section>
  <section class="wide">
    <h2>Games <span id="summary" class="dim"></span></h2>
    <div class="tablewrap"><table><thead><tr><th>#</th><th>Mode</th><th>Strategy</th><th>Level</th><th>XP</th><th>Moves</th><th>Cost</th><th>Ended</th></tr></thead><tbody id="games"></tbody></table></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "_");
const post = (url, body) => fetch(url, { method: "POST", body: body && JSON.stringify(body) });
const play = (games) => post("/api/play", { games });
const STAT_ICONS = { strength: "Strength", dexterity: "Dexterity", vitality: "Vitality", intelligence: "Intelligence", wisdom: "Wisdom", charisma: "Charisma" };

function renderState(s) {
  if (!s) return;
  const beast = s.beast ? `<div class="beast"><img src="/assets/beasts/${slug(s.beast.baseName)}.png" alt=""><div><b>${esc(s.beast.name)}</b><div class="pix dim">lvl ${s.beast.level} · T${s.beast.tier} ${esc(s.beast.type)} · ${s.beast.health} hp</div></div></div>` : "";
  const stats = Object.entries(STAT_ICONS).map(([k, icon]) => `<span class="pix"><img src="/assets/icons/${icon}.svg" alt="">${s.stats[k]}</span>`).join("");
  const gear = Object.values(s.equipment).map((g) => `<div><img src="/assets/loot/${slug(g.name)}.png" alt=""><span>${esc(g.name)}<small>T${g.tier} ${esc(g.type)} · G${g.greatness}</small></span></div>`).join("");
  $("adv").innerHTML = `
    <div class="row"><span class="big">Level ${s.level}</span><span class="pix dim">${s.over ? "slain" : s.inBattle ? "in battle" : "exploring"}</span></div>
    <div class="row pix"><span>${s.health} / ${s.maxHealth} hp</span><span class="dim">${s.gold} gold · ${s.xp} xp</span></div>
    <div class="bar"><div style="width:${Math.min(100, (100 * s.health) / s.maxHealth)}%"></div></div>
    ${beast}
    <div class="stats">${stats}</div>
    <div class="gear">${gear}</div>`;
}

function line(e) {
  const text = e.kind === "tool" ? `> ${e.name} ${JSON.stringify(e.input)}`
    : e.kind === "result" ? `  ${e.output.slice(0, 160)}`
    : e.kind === "turn" ? `turn done · $${e.costUsd.toFixed(3)}`
    : e.text;
  const div = document.createElement("div");
  div.className = `k-${e.kind}`;
  div.textContent = text;
  const feed = $("feed");
  const stick = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 20;
  feed.append(div);
  while (feed.childElementCount > 400) feed.firstElementChild.remove();
  if (stick) feed.scrollTop = feed.scrollHeight;
}

async function loadGames() {
  const games = await (await fetch("/api/games")).json();
  const levels = games.filter((g) => g.ended_at).map((g) => g.level).sort((a, b) => a - b);
  $("summary").textContent = levels.length ? `· ${levels.length} played · median level ${levels[Math.floor(levels.length / 2)]} · best ${levels.at(-1)}` : "";
  $("games").innerHTML = games.map((g) => `<tr><td>${g.id}</td><td>${g.mode}</td><td class="dim">${g.strategy}</td><td>${g.level ?? "…"}</td><td>${g.xp ?? ""}</td><td>${g.moves ?? ""}</td><td>$${g.cost_usd.toFixed(2)}</td><td class="dim">${g.ended_at ? new Date(g.ended_at).toLocaleString() : "playing"}</td></tr>`).join("");
}

fetch("/api/state").then((r) => r.json()).then(renderState);
loadGames();
const source = new EventSource("/events");
source.onopen = () => ($("status").textContent = "live");
source.onerror = () => ($("status").textContent = "reconnecting…");
source.onmessage = (m) => {
  const e = JSON.parse(m.data);
  if (e.kind === "state") return renderState(e.state);
  if (e.kind === "status") $("status").textContent = e.text;
  if (e.kind === "status" && /finished|practice game/.test(e.text)) loadGames();
  line(e);
};
</script>
</body>
</html>
