http:
  routers:
    ls-agent:
      rule: "Host(`ls.example.com`)"
      entryPoints:
        - websecure
      service: ls-agent
      middlewares:
        - globalHeaders@file
        - secureHeaders@file
      tls:
        certResolver: cfdns
  services:
    ls-agent:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4100"
